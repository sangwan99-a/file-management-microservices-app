spring.application.name=file-service

# PostgreSQL Datasource Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/filedb
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driverClassName=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update # Creates or updates schema based on entities. Use 'validate' or 'none' in production with a migration tool.
spring.jpa.show-sql=true # Optional: To see SQL queries
spring.jpa.properties.hibernate.format_sql=true # Optional: To format SQL queries

# Server port (optional, Spring Boot defaults to 8080 if not specified, choose a different one if running locally with auth-service)
# server.port=8082

# Eureka Client Configuration (if this service needs to register with Eureka)
# eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
# eureka.instance.preferIpAddress=true
